name: AgentShield Security Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-scan:
    name: AgentShield Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          fi
          if [ -d .opencode ] && [ -f .opencode/package.json ]; then
            cd .opencode && npm install && cd ..
          fi

      - name: Run AgentShield Local Gate
        run: node scripts/security-gate.mjs --min-grade=B

      - name: AgentShield Action Scanner
        uses: affaan-m/agentshield@v1
        continue-on-error: true
        with:
          path: "."
          min-severity: "medium"
          fail-on-findings: "true"
